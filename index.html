<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d3474"><title>投資信託 NAV ウォッチ</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#172744;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#0d3474;color:white;padding:24px max(18px,calc((100vw - 1120px)/2))}h1{font-size:24px;margin:0 0 8px}header p{margin:0;color:#d4e4fc;font-size:13px}main{max-width:1140px;margin:auto;padding:20px 12px 40px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card,.stat{background:white;border:1px solid #dce3ee;border-radius:14px;padding:18px;margin-bottom:16px}.stat small{display:block;color:#63738c;margin-bottom:9px}.stat strong{font-size:23px}.controls{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:14px}input,select,button{border:1px solid #cbd6e6;border-radius:9px;padding:11px;font:inherit;background:white;color:#172744}input{flex:1;min-width:160px}button{cursor:pointer}.primary{background:#0d4b9c;color:white}.muted{color:#65758d;font-size:13px}.notice{background:#fff7e8;border:1px solid #ecd6ac;padding:12px;border-radius:9px;font-size:13px;margin:12px 0}.tablebox{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;border-bottom:1px solid #edf1f7;padding:12px 8px}th{white-space:nowrap;color:#5d6c84}td:first-child{min-width:260px}td button{border:0;background:none;text-align:left;color:#0a4d9c;padding:0;font-weight:600}td button:hover{text-decoration:underline}.up{color:#b62945}.down{color:#007965}h2{font-size:18px;margin:0 0 15px}canvas{width:100%;height:320px;display:block}.legend{font-size:12px;color:#66758a}footer{font-size:12px;color:#63738c;line-height:1.8}@media(max-width:650px){.stats{gap:6px}.stat{padding:12px}.stat strong{font-size:18px}.stat small{font-size:11px}h1{font-size:21px}td:first-child{min-width:205px}}
</style></head><body><header><h1>投資信託 NAV ウォッチ</h1><p>48ファンド｜基準価額・前営業日比・履歴グラフ</p></header><main><div class="stats"><div class="stat"><small>登録ファンド</small><strong id="total">48</strong></div><div class="stat"><small>実データ取得済み</small><strong id="available">0 / 48</strong></div><div class="stat"><small>最新基準日</small><strong id="latest">—</strong></div></div><section class="card"><div class="controls"><input id="search" placeholder="ファンド名を検索"><select id="category"><option value="">全カテゴリ</option></select><button id="reload" class="primary">更新を確認</button></div><div id="status" class="notice">データを読み込み中…</div><div class="tablebox"><table><thead><tr><th>ファンド名</th><th>基準価額</th><th>前営業日比</th><th>基準日</th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="card"><h2 id="chartTitle">基準価額の推移</h2><div class="controls"><select id="period"><option value="7">1週間</option><option value="30">1か月</option><option value="90">3か月</option><option value="180">6か月</option><option value="365" selected>1年</option><option value="1095">3年</option><option value="1825">5年</option><option value="0">全期間</option></select><select id="mode"><option value="nav">基準価額（円）</option><option value="return">期間騰落率（%）</option></select></div><canvas id="chart"></canvas><p class="legend" id="chartNote">ファンドを選択してください。</p></section><footer>表示は基準価額であり、分配金再投資後のトータルリターンではありません。データ提供元の公表日・更新タイミングによって遅延します。未取得値は推測・補完しません。</footer></main><script>
let funds=[],dataset={history:{},errors:{},updated_at:null},selected=null;
const $=id=>document.getElementById(id),yen=n=>n==null?'—':Number(n).toLocaleString('ja-JP',{maximumFractionDigits:2})+'円';
async function load(){try{const [f,d]=await Promise.all([fetch('./funds.json',{cache:'no-store'}),fetch('./nav.json?ts='+Date.now(),{cache:'no-store'})]);if(!f.ok||!d.ok)throw Error('HTTP '+f.status+'/'+d.status);funds=await f.json();dataset=await d.json();render();}catch(e){$('status').textContent='データ読み込みエラー: '+e.message;}}
function render(){const h=dataset.history||{},count=funds.filter(f=>(h[f.id]||[]).length).length; $('total').textContent=funds.length;$('available').textContent=count+' / '+funds.length;const dates=Object.values(h).flat().map(x=>x.date).sort();$('latest').textContent=dates.at(-1)||'—';$('status').textContent=count===0?'現在、実データ配信元が未接続です。基準価額は未取得です。':`取得済み ${count}本 / ${funds.length}本。更新処理: ${dataset.updated_at?new Date(dataset.updated_at).toLocaleString('ja-JP'):'未実行'}。未取得ファンドは空欄表示です。`;
const cat=$('category');if(cat.options.length===1)[...new Set(funds.map(f=>f.category))].forEach(c=>cat.add(new Option(c,c)));const q=$('search').value.toLowerCase(),filter=cat.value;const rows=$('rows');rows.replaceChildren();for(const f of funds.filter(x=>x.name.toLowerCase().includes(q)&&(!filter||x.category===filter))){const a=h[f.id]||[],v=a.at(-1),p=a.at(-2),diff=v&&p?v.nav-p.nav:null,rate=diff!=null&&p.nav?diff/p.nav*100:null;const tr=document.createElement('tr');const td=document.createElement('td'),btn=document.createElement('button');btn.textContent=f.name;btn.onclick=()=>{selected=f.id;draw()};td.append(btn);tr.append(td);for(const [txt,cls] of [[yen(v?.nav),''],[diff==null?'—':`${diff>0?'+':''}${diff.toLocaleString('ja-JP',{maximumFractionDigits:2})}円 (${rate>0?'+':''}${rate.toFixed(2)}%)`,diff>0?'up':diff<0?'down':''],[v?.date||'—','']]){const c=document.createElement('td');c.textContent=txt;c.className=cls;tr.append(c)}rows.append(tr)}if(!selected&&funds.length)selected=funds[0].id;draw()}
function draw(){const f=funds.find(x=>x.id===selected),canvas=$('chart'),ctx=canvas.getContext('2d'),w=Math.max(300,canvas.clientWidth),height=320,scale=devicePixelRatio||1;canvas.width=w*scale;canvas.height=height*scale;ctx.setTransform(scale,0,0,scale,0,0);ctx.clearRect(0,0,w,height);$('chartTitle').textContent=f?f.name:'基準価額の推移';if(!f)return;let a=[...(dataset.history?.[f.id]||[])].sort((x,y)=>x.date.localeCompare(y.date));const period=+$('period').value;if(period&&a.length){const last=new Date(a.at(-1).date+'T00:00:00');last.setDate(last.getDate()-period);a=a.filter(x=>new Date(x.date+'T00:00:00')>=last)}if(!a.length){$('chartNote').textContent='このファンドの実際の基準価額データは未取得です。';ctx.fillStyle='#7b8799';ctx.font='15px sans-serif';ctx.fillText('データ未取得',Math.max(20,w/2-55),155);return}const isReturn=$('mode').value==='return',base=a[0].nav,ys=a.map(x=>isReturn?(x.nav/base-1)*100:x.nav);let min=Math.min(...ys),max=Math.max(...ys);if(min===max){min-=1;max+=1}const L=65,R=18,T=22,B=44,pw=w-L-R,ph=height-T-B;ctx.font='12px sans-serif';ctx.strokeStyle='#e4e9f2';ctx.fillStyle='#63738c';for(let i=0;i<=4;i++){let y=T+ph*i/4,val=max-(max-min)*i/4;ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(w-R,y);ctx.stroke();ctx.fillText(isReturn?val.toFixed(1)+'%':Math.round(val).toLocaleString(),4,y+4)}ctx.strokeStyle='#1764c2';ctx.lineWidth=2.5;ctx.beginPath();ys.forEach((v,i)=>{const x=L+(ys.length===1?pw/2:i*pw/(ys.length-1)),y=T+(max-v)/(max-min)*ph;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.fillStyle='#63738c';ctx.fillText(a[0].date,L,height-13);ctx.fillText(a.at(-1).date,w-R-76,height-13);$('chartNote').textContent=`${a.length}件｜${a[0].date} ～ ${a.at(-1).date}｜最新 ${yen(a.at(-1).nav)}${isReturn?'｜期間騰落率 '+ys.at(-1).toFixed(2)+'%':''}`}
$('search').addEventListener('input',render);$('category').addEventListener('change',render);$('period').addEventListener('change',draw);$('mode').addEventListener('change',draw);$('reload').addEventListener('click',load);window.addEventListener('resize',draw);load();
</script></body></html>
