name: Update fund NAV
on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * 1-5'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch configured NAV sources
        run: python update.py
      - name: Commit updated NAV data
        run: |
          if ! git diff --quiet -- nav.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add nav.json
            git commit -m "Update fund NAV data"
            git push
          fi
